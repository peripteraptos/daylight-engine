<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daylight panel – dev</title>
<link rel="icon" href="data:," />
<style>
  /* Approximation of Home Assistant's default light theme */
  html { --primary-color:#03a9f4; --primary-background-color:#fafafa; --secondary-background-color:#f2f3f5;
    --card-background-color:#fff; --primary-text-color:#212121; --secondary-text-color:#727272; --divider-color:#e0e0e0;
    --app-header-background-color:#fff; --app-header-text-color:#212121; --app-header-border-bottom:1px solid #e0e0e0;
    --text-primary-color:#fff; --error-color:#db4437; --warning-color:#ffa600; --success-color:#43a047;
    --ha-card-border-radius:12px; font-family: Roboto, Inter, system-ui, sans-serif; }
  html.dark { --primary-background-color:#111; --secondary-background-color:#1f1f1f; --card-background-color:#1c1c1c;
    --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --divider-color:#2f2f2f;
    --app-header-background-color:#1c1c1c; --app-header-text-color:#e1e1e1; --app-header-border-bottom:1px solid #2f2f2f; }
  body { margin: 0; }
</style>
</head>
<body>
<script type="module">
  import "../../custom_components/daylight_engine/frontend/daylight-panel.js";
  import { hass, log } from "./mock-hass.js";
  const params = new URLSearchParams(location.search);
  if (params.get("dark")) document.documentElement.classList.add("dark");
  const el = document.createElement("daylight-engine-panel");
  el.narrow = !!params.get("narrow");
  el.hass = hass;
  window.panel = el; window.wsLog = log;
  document.body.append(el);
</script>
</body>
</html>
